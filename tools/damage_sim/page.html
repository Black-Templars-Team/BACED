<title>Astartes Wound Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&family=Roboto+Condensed:wght@400;500&display=swap">
<style>
/* Layout: inputs rail on the left in task order, results on the right (lead -> medical menu -> one shot -> chain). */
:root {
    --bg: #eceff1;
    --surface: #ffffff;
    --well: #e3e7ea;
    --ink: #14181c;
    --ink-2: #48525b;
    --ink-3: #66717b;
    --line: #d3d9de;
    --accent: #2c5a82;
    --accent-wash: #dde8f2;
    --plate: #74828f;
    --uncon: #d08000;
    --fatal: #c62f2f;
    --hit: #2c5a82;
    --miss: #9aa4ad;
    --font-ui: "Archivo", "Segoe UI", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --font-arma: "Roboto Condensed", "Arial Narrow", sans-serif;
    --r: 6px;
    /* Weapon balancing: categorical slots (dataviz reference order, validated on these surfaces) */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #111417; --surface: #1a1f24; --well: #242b32; --ink: #e5e9ed; --ink-2: #aab4bd; --ink-3: #8c98a3;
        --line: #2f373f; --accent: #7cacd8; --accent-wash: #22364a; --plate: #8d9aa6; --uncon: #c98500; --fatal: #d13a3a;
        --hit: #7cacd8; --miss: #5d6872; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #111417; --surface: #1a1f24; --well: #242b32; --ink: #e5e9ed; --ink-2: #aab4bd; --ink-3: #8c98a3;
    --line: #2f373f; --accent: #7cacd8; --accent-wash: #22364a; --plate: #8d9aa6; --uncon: #c98500; --fatal: #d13a3a;
    --hit: #7cacd8; --miss: #5d6872; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
    margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 40px;
}
.num, input[type="number"], .mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-weight: 650; text-wrap: balance; margin: 0; }
h1 { font-size: 20px; font-stretch: 85%; letter-spacing: 0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 600; }
.top { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; max-width: 1360px; margin: 0 auto 16px; }
.top .meta { color: var(--ink-3); font-size: 12px; }
.layout { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 16px; max-width: 1360px; margin: 0 auto; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* rail */
.rail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .label { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.02em; }
fieldset.field { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.field > legend { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 0; margin-bottom: 6px; }
.unit-summary { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; }
.unit-summary dd { margin: 0; overflow-wrap: anywhere; }
.hint { font-size: 12px; color: var(--ink-3); }
input, select, button, textarea { font: inherit; color: inherit; }
input[type="text"], input[type="search"], input[type="number"], select, textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 0;
}
select[size] { padding: 2px; }
select[size] option { padding: 3px 6px; border-radius: 3px; }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible, canvas:focus-visible, .zone:focus-visible, svg rect:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
}
.row2 { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; justify-self: start; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 6px 14px; cursor: pointer; font-weight: 550; color: var(--ink-2); }
.seg input:checked + label { background: var(--accent); color: var(--surface); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg input:disabled + label { cursor: not-allowed; opacity: 0.45; }

/* aim figure */
.aim-wrap { display: grid; gap: 8px; }
.aim-canvas { width: 100%; max-width: 300px; justify-self: center; display: block; cursor: crosshair; background: var(--well); border-radius: 4px; touch-action: none; }
.aim-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.body-svg { width: 132px; height: auto; display: block; }
.zone { fill: var(--well); stroke: var(--line); stroke-width: 1; cursor: pointer; }
.zone:hover { fill: var(--accent-wash); }
.zone[aria-pressed="true"] { fill: var(--accent); stroke: var(--accent); }
button.plain { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); }
button.plain:hover { background: var(--well); }
button.plain[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); }

/* results */
.results { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.lead { display: grid; gap: 14px; }
.lead-figures { display: flex; flex-wrap: wrap; gap: 8px 36px; align-items: baseline; }
.hero { font-size: 44px; font-weight: 700; font-stretch: 80%; line-height: 1; }
.lead-second { font-size: 18px; font-weight: 600; }
.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.lead-context { color: var(--ink-2); max-width: 75ch; margin: 0; }
.chart-head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--ink-2); }
.legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.legend .dot.ring { background: transparent; border: 1.5px solid var(--fatal); }
.changes { font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.changes .label { font-weight: 600; }
.changes .reset { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 4px; font-size: 12px; }
.series-key { display: inline-block; width: 14px; border-top: 2px solid; vertical-align: 3px; margin-right: 6px; }
.chart-box { position: relative; }
.chart-box svg { width: 100%; height: auto; display: block; overflow: visible; }
.grid line { stroke: var(--line); stroke-width: 1; }
.axis text { fill: var(--ink-3); font: 11px var(--font-num); }
.axis-title { fill: var(--ink-2); font: 12px var(--font-ui); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); min-width: 190px; z-index: 2; }
.tip .v { font: 600 13px var(--font-num); }
.tip .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tip .row span:first-child { color: var(--ink-2); }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; border-bottom: 1px solid var(--line); padding: 4px 8px; }
td { padding: 4px 8px; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; max-height: 320px; }

.inspect { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.inspect input[type="number"] { width: 84px; }
.inspect input[type="range"] { flex: 1 1 200px; min-width: 140px; }

/* ACE medical menu replica */
.ace-menu { background: #2b2b2b; color: #fff; font-family: var(--font-arma); border-radius: 2px; overflow: hidden; margin-top: 12px; }
.ace-title { background: #d18b20; color: #fff; padding: 3px 10px; font-size: 17px; font-weight: 500; }
.ace-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 10px 14px 16px; }
@media (max-width: 620px) { .ace-cols { grid-template-columns: minmax(0, 1fr); } }
.ace-head { text-align: center; font-size: 18px; letter-spacing: 0.02em; border-bottom: 1px solid rgba(255, 255, 255, 0.45); padding-bottom: 3px; margin-bottom: 8px; }
.ace-status { display: grid; justify-items: center; gap: 8px; }
.ace-body { width: 100%; max-width: 300px; aspect-ratio: 1; background: rgba(0, 0, 0, 0.35); cursor: pointer; display: block; }
.ace-part-pick { background: #111; color: #fff; text-align: center; width: 100%; padding: 2px; font-size: 15px; }
.ace-list { background: rgba(0, 0, 0, 0.35); min-height: 220px; padding: 6px 10px; font-size: 15px; line-height: 1.35; }
.ace-list div { white-space: pre-wrap; }
.ace-state { padding: 0 14px 12px; font-size: 14px; color: #ddd; }

.onehit-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; margin-top: 12px; }
@media (max-width: 700px) { .onehit-grid { grid-template-columns: minmax(0, 1fr); } }
.wound-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 0; }
.wound-row .pct { font: 500 13px var(--font-num); text-align: right; }
.wound-row .name { font-weight: 600; }
.wound-row .part { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.bar { height: 4px; background: var(--well); border-radius: 2px; margin-top: 4px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; align-content: start; }
.fact .v { font: 600 18px var(--font-num); }
.fact .l { font-size: 12px; color: var(--ink-3); }
.empty { color: var(--ink-2); padding: 6px 0; margin: 0; }

/* chain */
.chain-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
ol.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; counter-reset: step; }
ol.steps > li { counter-increment: step; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
ol.steps > li::before { content: counter(step); font: 600 13px var(--font-num); color: var(--ink-3); padding-top: 1px; }
.step-title { font-weight: 650; font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.badge.assume { color: var(--uncon); border-color: currentColor; }
.step-result { margin-top: 4px; font: 500 13px/1.6 var(--font-num); color: var(--ink); overflow-wrap: anywhere; }
.step-text { margin: 4px 0 0; color: var(--ink-2); max-width: 80ch; }
.params { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 14px; margin-top: 10px; }
.param { display: grid; gap: 2px; align-content: start; }
.param label { font-size: 12px; color: var(--ink-2); }
.param .ctl { display: flex; gap: 4px; align-items: center; }
.param input[type="number"], .param select { padding: 3px 6px; }
.param .src { font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
.param.changed input, .param.changed select { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.param .reset { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 4px; font-size: 12px; }
.param input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.wound-chip { display: block; }

.sources { font-size: 12px; color: var(--ink-2); display: grid; gap: 10px; }
.sources p { margin: 0; }
.sources ul { margin: 4px 0 0; padding-left: 18px; }
.sources textarea { min-height: 90px; font: 12px var(--font-num); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.err { color: var(--fatal); font-weight: 600; }
/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); grid-column: 1 / -1; overflow-x: auto; }
.tabs [role="tab"] { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 14px;
    font-weight: 600; color: var(--ink-2); cursor: pointer; }
.tabs [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs [role="tab"]:hover { color: var(--ink); }
body.tab-balance .single-only { display: none !important; }

/* weapon balancing */
.balance { display: grid; gap: 14px; }
.balance-intro { margin: 0; color: var(--ink-2); max-width: 80ch; }
.balance-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; }
.balance-controls .field { gap: 4px; }
.balance-controls input[type="number"] { width: 84px; }
.balance[data-view="table"] .bal-chart-only { display: none; }
.balance-table { display: grid; gap: 8px; min-width: 0; }
.balance-table .toolbar input { flex: 0 1 260px; }
.balance-table button:disabled { cursor: default; opacity: 0.55; }
.balance-table .hint { margin: 0; }
.balance-table .table-scroll { max-height: min(65vh, 600px); overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
.balance-table th { position: sticky; top: 0; background: var(--well); padding: 0; }
.balance-table th button { width: 100%; border: 0; padding: 7px 8px; background: none; cursor: pointer; text-align: inherit; white-space: nowrap; }
.balance-table th button:hover { background: var(--accent-wash); }
.balance-table th button:focus-visible { outline-offset: -2px; }
.balance-table th[aria-sort] { color: var(--accent); }
.balance-table .sort-arrow::after { display: inline-block; width: 1em; margin-left: 4px; content: ""; }
.balance-table [aria-sort="ascending"] .sort-arrow::after { content: "\2191"; }
.balance-table [aria-sort="descending"] .sort-arrow::after { content: "\2193"; }
.balance-table td { white-space: nowrap; }
.progress { font-size: 12px; color: var(--ink-3); min-height: 1.45em; }
.scatter-box { position: relative; user-select: none; -webkit-user-select: none; }
.scatter-box svg { display: block; width: 100%; height: auto; cursor: grab; touch-action: none; }
.scatter-box svg.panning { cursor: grabbing; }
.scatter-box svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.scatter-tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
.scatter-tools button { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; min-width: 30px; height: 30px;
    padding: 0 8px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.scatter-tools button:hover { background: var(--well); }
.scatter-box .acquisition-band { fill: var(--well); }
.scatter-box .scatter-reference { stroke: var(--ink-3); stroke-dasharray: 4 3; }
.scatter-box .scatter-caption { fill: var(--ink-2); font: 11px var(--font-ui); }
.scatter-box .scatter-strip { fill: var(--well); stroke: var(--line); }
.scatter-note { margin: 0; }
.mark { stroke: var(--surface); stroke-width: 1.5; }
.mark-ring { fill: var(--surface); stroke-width: 2; }
.dim .mark, .dim .mark-ring { opacity: 0.12; }
.dim .hl .mark, .dim .hl .mark-ring { opacity: 1; }
.focus-ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.tip.pinned { pointer-events: auto; }
.scatter-box .tip { max-width: 260px; overflow: auto; overscroll-behavior: contain; }
.scatter-box .tip-stack { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.tip h4 { margin: 0 0 2px; font-size: 13px; }
.tip .sub { color: var(--ink-3); font-size: 11px; margin-bottom: 6px; overflow-wrap: anywhere; }
.tip ul { margin: 4px 0 0; padding-left: 16px; }
.tip .sub.ammo { color: var(--ink); font-size: 12px; margin-bottom: 0; }
.tip .open { margin-top: 8px; }
.blegend { display: grid; gap: 10px; }
.blegend-group { display: grid; gap: 4px; }
.blegend-group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; }
.blegend-items { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.blegend-item { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none; border-radius: 4px;
    padding: 3px 6px; cursor: pointer; font-size: 12px; color: var(--ink); }
.blegend-item:hover { background: var(--well); }
.blegend-item[aria-pressed="false"] { color: var(--ink-3); text-decoration: line-through; }
.blegend-item[aria-pressed="false"] svg { opacity: 0.35; }
.blegend-item .count { color: var(--ink-3); font-family: var(--font-num); font-size: 11px; }
.blegend-item svg { width: 12px; height: 12px; flex: none; }
.balance.expanded { position: fixed; inset: 0; z-index: 20; overflow: auto; border-radius: 0;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.balance:fullscreen { overflow: auto; padding: 16px; }
@media (max-width: 520px) {
    .balance-controls .seg label { padding-inline: 8px; font-size: 12px; }
}
.never { font-size: 12px; color: var(--ink-2); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
    <h1>Astartes Wound Bench</h1>
    <span class="meta" id="meta"></span>
</header>

<main class="layout">
        <div class="tabs" role="tablist" aria-label="View">
            <button type="button" role="tab" id="tabSingle" aria-controls="singleView" aria-selected="true">Single weapon</button>
            <button type="button" role="tab" id="tabBalance" aria-controls="balance" aria-selected="false" tabindex="-1">Weapon balancing</button>
        </div>
    <aside class="rail" aria-label="Scenario">
        <div class="field">
            <span class="label" id="targetLabel">Target</span>
            <div class="seg" role="radiogroup" aria-labelledby="targetLabel">
                <input type="radio" name="target" id="targetPlayer" value="player"><label for="targetPlayer">Player</label>
                <input type="radio" name="target" id="targetAi" value="ai"><label for="targetAi">AI</label>
            </div>
            <span class="hint" id="targetHint"></span>
        </div>
        <div class="field">
            <label for="targetStance">Target stance</label>
            <select id="targetStance">
                <option value="standing">Standing</option>
                <option value="crouched">Crouched</option>
            </select>
        </div>
        <div class="field single-only">
            <label for="weaponFilter">Weapon</label>
            <input type="search" id="weaponFilter" placeholder="Filter by name, class or mod" autocomplete="off">
            <select id="weapon" size="7" aria-label="Weapon list"></select>
            <span class="hint" id="weaponHint"></span>
        </div>
        <div class="field single-only" id="muzzleField" hidden>
            <label for="muzzle">Muzzle</label>
            <select id="muzzle"></select>
        </div>
        <div class="field single-only">
            <label for="fireMode">Fire mode</label>
            <select id="fireMode"></select>
        </div>
        <div class="field single-only">
            <label for="magazine">Ammunition</label>
            <select id="magazine"></select>
        </div>
        <div class="field">
            <label for="distance">Range (m)</label>
            <div class="row2">
                <input type="range" id="distanceSlider" min="0" max="1500" step="5" aria-label="Range slider">
                <input type="number" id="distance" min="0" max="5000" step="5">
            </div>
        </div>
        <div class="field single-only">
            <label for="magazines">Magazines fired</label>
            <div class="row2">
                <input type="range" id="magazinesSlider" min="1" max="10" step="1" aria-label="Magazines slider">
                <input type="number" id="magazines" min="1" max="20" step="1">
            </div>
            <span class="hint" id="magHint"></span>
        </div>
        <div class="field">
            <label for="spread">Shooter aim error (mrad)</label>
            <input type="number" id="spread" min="0" max="50" step="0.5">
            <span class="hint">Added to the weapon's own dispersion. 0 is a perfect rest; 2 to 5 is a standing rifleman.</span>
        </div>
        <div class="field">
            <span class="label" id="aimLabel">Aim point</span>
            <div class="aim-wrap" id="aimWrap">
                <canvas id="aimCanvas" class="aim-canvas" tabindex="0" aria-labelledby="aimLabel" hidden></canvas>
                <svg class="body-svg" viewBox="0 0 132 250" role="group" aria-labelledby="aimLabel" id="bodySvg" hidden>
                    <circle class="zone" data-hp="HitHead" cx="66" cy="22" r="17" tabindex="0" role="button" aria-label="Head"></circle>
                    <rect class="zone" data-hp="HitNeck" x="58" y="41" width="16" height="9" rx="2" tabindex="0" role="button" aria-label="Neck"></rect>
                    <rect class="zone" data-hp="HitChest" x="42" y="52" width="48" height="26" rx="5" tabindex="0" role="button" aria-label="Chest"></rect>
                    <rect class="zone" data-hp="HitDiaphragm" x="43" y="80" width="46" height="18" rx="3" tabindex="0" role="button" aria-label="Diaphragm"></rect>
                    <rect class="zone" data-hp="HitAbdomen" x="44" y="100" width="44" height="18" rx="3" tabindex="0" role="button" aria-label="Abdomen"></rect>
                    <rect class="zone" data-hp="HitPelvis" x="44" y="120" width="44" height="18" rx="4" tabindex="0" role="button" aria-label="Pelvis"></rect>
                    <rect class="zone" data-hp="HitRightArm" x="22" y="54" width="17" height="80" rx="7" tabindex="0" role="button" aria-label="Right arm"></rect>
                    <rect class="zone" data-hp="HitLeftArm" x="93" y="54" width="17" height="80" rx="7" tabindex="0" role="button" aria-label="Left arm"></rect>
                    <rect class="zone" data-hp="HitRightLeg" x="45" y="141" width="19" height="100" rx="7" tabindex="0" role="button" aria-label="Right leg"></rect>
                    <rect class="zone" data-hp="HitLeftLeg" x="68" y="141" width="19" height="100" rx="7" tabindex="0" role="button" aria-label="Left leg"></rect>
                </svg>
                <div class="aim-row">
                    <select id="aimPreset" aria-label="Aim at a hitpoint"></select>
                    <button type="button" class="plain" id="blastBtn" aria-pressed="false">Blast only</button>
                </div>
                <div class="field" id="blastDistanceField" hidden>
                    <label for="blastDistance">Distance from burst (m)</label>
                    <input type="number" id="blastDistance" min="0" step="any">
                </div>
                <div class="legend" id="aimLegend"></div>
                <span class="hint" id="aimHint"></span>
            </div>
        </div>
        <fieldset class="field" id="loadoutField">
            <legend>Loadout</legend>
            <input type="search" id="uniformFilter" aria-label="Filter uniforms" placeholder="Filter uniforms" autocomplete="off">
            <select id="uniform" aria-label="Uniform"></select>
            <input type="search" id="vestFilter" placeholder="Filter vests (pauldrons)" autocomplete="off">
            <select id="vest" aria-label="Vest"></select>
            <input type="search" id="helmetFilter" placeholder="Filter helmets" autocomplete="off">
            <select id="helmet" aria-label="Helmet"></select>
            <input type="search" id="backpackFilter" placeholder="Filter backpacks (power pack)" autocomplete="off">
            <select id="backpack" aria-label="Backpack"></select>
            <span class="hint">Neither the engine nor ACE reads armor from backpacks.</span>
        </fieldset>
        <fieldset class="field" id="unitField" hidden>
            <legend>Unit</legend>
            <div class="seg" role="radiogroup" aria-label="Browse AI by units or groups">
                <input type="radio" name="aiBrowse" id="browseUnits" value="units"><label for="browseUnits">Units</label>
                <input type="radio" name="aiBrowse" id="browseGroups" value="groups"><label for="browseGroups">Groups</label>
            </div>
            <input type="search" id="aiFilter" aria-label="Filter AI units" placeholder="Filter by name, class, faction or mod" autocomplete="off">
            <div class="field"><label for="aiSide">Side</label><select id="aiSide"></select></div>
            <div class="field"><label for="aiFaction">Faction</label><select id="aiFaction"></select></div>
            <div class="field"><label for="aiCategory">Category</label><select id="aiCategory"></select></div>
            <div class="field" id="aiGroupField" hidden><label for="aiGroup">Group</label><select id="aiGroup"></select></div>
            <select id="aiUnit" aria-label="Unit"></select>
            <span class="hint" id="aiHint" role="status" hidden></span>
            <dl class="hint unit-summary" id="aiSummary"></dl>
        </fieldset>
        <div class="field">
            <span class="label" id="bcoLabel">Black Carapace armor mode</span>
            <div class="seg" role="radiogroup" aria-labelledby="bcoLabel">
                <input type="radio" name="bco" id="bcoOn" value="on"><label for="bcoOn">Suit on</label>
                <input type="radio" name="bco" id="bcoOff" value="off"><label for="bcoOff">Suit off</label>
            </div>
            <span class="hint" id="bcoHint"></span>
        </div>
        <div class="field" id="haloField">
            <label for="halo">Iron Halo</label>
            <select id="halo">
                <option value="none">None</option>
                <option value="bronze">Bronze</option>
                <option value="silver">Silver</option>
                <option value="gold">Gold</option>
                <option value="refractor">Refractor field</option>
            </select>
        </div>
    </aside>

    <section class="results">
        <div class="results single-only" id="singleView" role="tabpanel" aria-labelledby="tabSingle" aria-live="polite">
            <div class="panel lead" id="lead"></div>
            <div class="panel" id="medical"></div>
            <div class="panel" id="onehit"></div>
            <div class="panel" id="chain"></div>
        </div>
        <div class="panel balance" id="balance" role="tabpanel" aria-labelledby="tabBalance" hidden></div>
        <div class="panel sources" id="sources"></div>
    </section>
</main>
