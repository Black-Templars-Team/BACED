name: BACED Arma

on:
  push:
    branches:
    - baced
  pull_request:

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v6
    - name: Check for BOM
      uses: arma-actions/bom-check@master
      with:
        path: 'addons'
    - name: Setup HEMTT
      uses: arma-actions/hemtt@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Authenticated API requests to avoid rate limits
      with:
        annotate: true
    - name: Run HEMTT check
      run: hemtt check

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v6
    - name: Setup HEMTT
      uses: arma-actions/hemtt@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Authenticated API requests to avoid rate limits
      with:
        annotate: true
    - name: Run HEMTT build
      run: hemtt build
    - name: Rename build folder
      run: mv .hemttout/build .hemttout/@baced
    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: baced-${{ github.sha }}
        path: .hemttout/@*
        include-hidden-files: true # Because .hemttout is a hidden directory
