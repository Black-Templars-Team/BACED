[config.file_type]
options.allow_no_extension = true

[stringtables.usage]
options.ignore_unused = true

[sqf.banned_commands]
options.ignore = [
    "addPublicVariableEventHandler", # Alt syntax is broken, ACE uses main syntax
    "createSoundSource", # Greatly attenuated when in first person and in a vehicle
]

[sqf.var_all_caps]
options.ignore = [
    "SLX_*", "ACE_*"
]

[sqf.banned_macros]
options.release = [
    "DEBUG_MODE_FULL", "DISABLE_COMPILE_CACHE", "ENABLE_PERFORMANCE_COUNTERS"
]

[sqf.undefined]
enabled = true
